name: SATURN CI

on:
  push:
    branches:
      - main
      - foundation/saturn-v1
      - copilot/continue-development-saturn
  pull_request:
    branches:
      - main
      - foundation/saturn-v1
      - copilot/continue-development-saturn

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install SATURN
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run deterministic test suite
        run: pytest -q
