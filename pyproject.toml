[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saturn-ai"
version = "0.1.0"
description = "SATURN — a production-grade AI computer agent"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pyautogui>=0.9.54",
    "Pillow>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
saturn-core = "saturn.core.server:serve"
saturn-ai-smoke = "saturn.runtime.ai_smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
